
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 1 Year.</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#7a2e3b;--rose:#e07a85;--pink:#f4b6c6;--blush:#f9d5de;--cream:#f7eddc;--red:#e0364f;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0;height:100%;overflow:hidden;font-family:"Pixelify Sans",ui-monospace,monospace;color:var(--ink);
 background:radial-gradient(ellipse at 20% 0%,#fbc6d6 0,transparent 55%),radial-gradient(ellipse at 80% 100%,#fbd9b8 0,transparent 50%),var(--cream);
 user-select:none;-webkit-user-select:none;touch-action:none}
.heart{position:fixed;top:-20px;color:var(--red);pointer-events:none;animation:fall linear infinite;z-index:0}
@keyframes fall{to{transform:translateY(110vh) rotate(30deg)}}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;transition:opacity .6s}
.scene.hide{opacity:0;pointer-events:none}
#envelope{width:150px;transition:transform .2s}
#envelope.hit{animation:shake .5s}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.title{margin:28px 0 70px;font-size:20px}
.title i{color:var(--red);font-style:normal;margin:0 8px}
#bowWrap{position:relative;width:170px;height:120px;cursor:grab}
#arrow{position:absolute;left:50%;bottom:34px;width:14px;margin-left:-7px;transition:transform .05s}
#arrow.fly{transition:transform .5s cubic-bezier(.4,0,1,1);transform:translateY(-70vh)!important}
.hint{position:absolute;bottom:calc(8% + env(safe-area-inset-bottom,0px));font-size:14px;opacity:.8}
.win{width:min(340px,90vw);border:4px solid var(--rose);border-radius:10px;background:var(--pink);box-shadow:0 14px 30px #d6788a55;overflow:hidden;
 transform:scale(.6);opacity:0;transition:.5s cubic-bezier(.2,1.4,.4,1)}
.win.show{transform:none;opacity:1}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-weight:700;letter-spacing:1px;background:#f0aebf;border-bottom:4px solid var(--rose)}
.ctl span{display:inline-block;width:20px;height:18px;margin-left:5px;background:#fff6f4;border:2px solid var(--rose);border-radius:3px;font-size:10px;text-align:center;line-height:14px}
.hearts{background:var(--blush);padding:6px;text-align:center;color:var(--red);letter-spacing:6px;border-bottom:4px solid var(--rose)}
.body{position:relative;padding:18px 16px 20px;text-align:center;min-height:320px;
 background:repeating-linear-gradient(0deg,#ffffff30 0 14px,transparent 14px 28px),repeating-linear-gradient(90deg,#ffffff30 0 14px,transparent 14px 28px),#f2a9bd}
#q{font-size:19px;line-height:1.25;margin:0 0 12px;min-height:48px}
#cat{width:132px;display:block;margin:0 auto 14px;transition:transform .4s}
#cat.happy{transform:rotate(-8deg) scale(1.05);animation:bob .6s infinite alternate}
@keyframes bob{to{transform:rotate(6deg) scale(1.05)}}
.btns{display:flex;justify-content:center;gap:14px;height:46px}
button{font:700 18px "Pixelify Sans",monospace;color:var(--ink);background:#fff6f4;border:3px solid var(--rose);border-radius:6px;padding:6px 16px;cursor:pointer;box-shadow:0 3px 0 var(--rose)}
#yes{outline:3px dashed var(--rose);outline-offset:3px}
#no{z-index:3}
#msg{font-size:16px;line-height:1.3;margin:0;opacity:0;transition:opacity .6s .4s}
#msg b{background:#3a63e0;color:#fff;font-weight:400;padding:0 3px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="scene" id="s1">
  <svg id="envelope" viewBox="0 0 150 110"><rect x="4" y="12" width="142" height="96" rx="6" fill="#fff4ee" stroke="#e07a85" stroke-width="5"/><path d="M6 14 L75 62 L144 14 Z" fill="#f4b6c6" stroke="#e07a85" stroke-width="4" stroke-linejoin="round"/><path d="M6 106 L58 56 M144 106 L92 56" stroke="#e8b0b6" stroke-width="4"/><path d="M75 78 C58 64 62 50 75 56 C88 50 92 64 75 78Z" fill="#e0364f"/></svg>
  <div class="title"><i>♥</i>Happy 1 Year <i>♥</i></div>
  <div id="bowWrap">
    <svg id="arrow" viewBox="0 0 14 70" height="70"><path d="M7 0 L14 14 L9 14 L9 70 L5 70 L5 14 L0 14Z" fill="#e0364f"/></svg>
    <svg viewBox="0 0 170 120" style="position:absolute;inset:0"><path d="M10 40 Q85 130 160 40" fill="none" stroke="#b9772f" stroke-width="9" stroke-linecap="round"/><path d="M10 40 L85 78 L160 40" id="str" fill="none" stroke="#8a5a28" stroke-width="2"/><rect x="68" y="62" width="34" height="14" rx="6" fill="#a8681f"/></svg>
  </div>
  <div class="hint"> Daly &amp; release to shoot Cupid's arrow ♥</div>
</div>

<div class="scene hide" id="s2">
  <div class="win" id="win">
    <div class="bar">LOVE<span class="ctl"><span>_</span><span>□</span><span>×</span></span></div>
    <div class="hearts">♥ ▪ ♥ ▪ ♥</div>
    <div class="body" id="body">
      <p id="q">Happy anniversary 1 Year, my love ♡ Do You Still love me?</p>
      <svg id="cat" viewBox="0 0 14 13" shape-rendering="crispEdges"></svg>
      <div class="btns"><button id="yes">YES</button><button id="no">NO</button></div>
      <p id="msg" style="position:absolute;left:16px;right:16px;bottom:18px">One Year of marriage, a <b>lifetime</b> to go. Happy anniversary, my love ♡</p>
    </div>
  </div>
</div>

<script>
// ---- falling background hearts
for(let i=0;i<26;i++){const h=document.createElement("div");h.className="heart";h.textContent="♥";
 h.style.left=Math.random()*100+"vw";h.style.fontSize=(8+Math.random()*12)+"px";h.style.opacity=.3+Math.random()*.5;
 h.style.animationDuration=(7+Math.random()*9)+"s";h.style.animationDelay=-Math.random()*14+"s";document.body.appendChild(h)}

// ---- pixel cat
const rows=["..##......##..",".###......###.",".############.",".############.",".#WW######WW#.",".#WK######WK#.",".############.",".#PP######PP#.","..##RR####RR##","..#RRRRRRRRRR#","...#RRRRRRRR#.","....#RRRRRR#..",".....######..."];
const col={"#":"#161216",W:"#fff",K:"#161216",P:"#f49aa8",R:"#e0364f"};
let svg="";rows.forEach((r,y)=>[...r].forEach((c,x)=>{if(col[c])svg+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${col[c]}"/>`}));
document.getElementById("cat").innerHTML=svg;

// ---- stage 1: bow & arrow
const $=id=>document.getElementById(id);
const arrow=$("arrow"),wrap=$("bowWrap");let startY=null,pull=0,shot=false;
function setPull(p){pull=Math.max(0,Math.min(50,p));arrow.style.transform=`translateY(${pull}px)`}
wrap.addEventListener("pointerdown",e=>{if(shot)return;startY=e.clientY;wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener("pointermove",e=>{if(startY!==null)setPull(e.clientY-startY)});
function release(){if(startY===null||shot)return;startY=null;shot=true;
 arrow.style.transform=`translateY(${pull}px)`;requestAnimationFrame(()=>{arrow.classList.add("fly");arrow.style.transform=""});
 setTimeout(()=>$("envelope").classList.add("hit"),380);setTimeout(openWin,900)}
wrap.addEventListener("pointerup",()=>{if(pull<5)setPull(30);release()});
wrap.addEventListener("pointercancel",release);

function openWin(){$("s1").classList.add("hide");$("s2").classList.remove("hide");setTimeout(()=>$("win").classList.add("show"),50)}

// ---- stage 2: dodging NO
const no=$("no"),body=$("body");let dodged=false;
function dodge(e){e.preventDefault();const b=body.getBoundingClientRect(),n=no.getBoundingClientRect();
 if(!dodged){dodged=true;no.style.position="absolute";no.style.left=(n.left-b.left)+"px";no.style.top=(n.top-b.top)+"px"}
 const maxX=b.width-n.width-8,maxY=b.height-n.height-8;let x,y,t=0;
 do{x=8+Math.random()*maxX;y=8+Math.random()*maxY;t++}while(t<20&&Math.hypot(x-(n.left-b.left),y-(n.top-b.top))<70);
 no.style.left=x+"px";no.style.top=y+"px"}
["pointerenter","pointerdown","touchstart","click"].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));

// ---- YES: heart confetti
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],run=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);
function burst(){const cols=["#e0364f","#f26a8d","#f9a8c0","#ffb36b","#a78bfa","#f4c542"];
 for(let i=0;i<110;i++)parts.push({x:Math.random()*cv.width,y:cv.height*(.55+Math.random()*.2),vx:(Math.random()-.5)*5,vy:-6-Math.random()*9,
  s:(14+Math.random()*26)*devicePixelRatio,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.2,a:1});
 if(!run){run=true;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);
 parts.forEach(p=>{p.vy+=.22*devicePixelRatio/2;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.a-=.004;
  cx.save();cx.globalAlpha=Math.max(p.a,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.font=p.s+"px sans-serif";cx.textAlign="center";cx.fillText("♥",0,0);cx.restore()});
 parts=parts.filter(p=>p.a>0&&p.y<cv.height+60);
 if(parts.length)requestAnimationFrame(loop);else run=false}
$("yes").addEventListener("click",()=>{
 $("q").textContent="Yayyy! I love you ♡";$("cat").classList.add("happy");
 document.querySelector(".btns").style.visibility="hidden";no.style.display="none";$("msg").style.opacity=1;
 burst();setTimeout(burst,500);setTimeout(burst,1100)});
</script>
</body>
</html>
